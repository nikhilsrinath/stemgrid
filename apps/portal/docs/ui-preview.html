<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StemGrid Portal · UI preview (demo data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same design as apps/portal/src/ui/ui.module.css (class names without the CSS-module hashing). */
:root {
  --red:#E3121B; --red-deep:#B20912; --red-soft:#FDE8E8; --cream:#FFF3E0; --cream-2:#FFF8EE;
  --ink:#18181B; --label:#3F3F46; --dim:#71717A; --dim-2:#A1A1AA; --line:rgb(24 24 27/.08);
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --card:rgb(255 255 255/.78); --shadow:0 1px 2px rgb(24 24 27/.04),0 8px 28px rgb(24 24 27/.07);
  --shadow-lg:0 2px 6px rgb(24 24 27/.05),0 24px 60px rgb(24 24 27/.12); --font:'Plus Jakarta Sans',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; }
.root { min-height:100vh; color:var(--ink); font:400 14.5px/1.5 var(--font); -webkit-font-smoothing:antialiased; padding-bottom:70px;
  background: radial-gradient(1200px 600px at 100% -10%, rgb(227 18 27/.07), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgb(255 160 80/.12), transparent 60%), var(--cream-2); }
.root a { color:inherit; } .root h1,.root h2,.root h3,.root p { margin:0; }
.root :focus-visible { outline:2px solid var(--red); outline-offset:2px; }
.logo { display:inline-flex; align-items:center; gap:9px; text-decoration:none; font:700 16px/1 var(--font); letter-spacing:-.02em; }
.mark { display:grid; grid-template-columns:1fr 1fr; gap:2.4px; width:22px; height:22px; padding:4.6px; border-radius:6px; background:var(--red); flex:none; }
.mark i { border-radius:50%; background:#fff; }
.instInitials { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:var(--ink); color:#fff; font-weight:700; font-size:13px; flex:none; }
.instInitials.lg { width:64px; height:64px; border-radius:16px; font-size:22px; }
.instInitials.red { background:linear-gradient(135deg,#E3121B,#9E0710); }
.top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px; padding:10px clamp(14px,3vw,28px); background:rgb(255 251 245/.72); backdrop-filter:saturate(1.4) blur(14px); box-shadow:0 1px 0 var(--line); }
.brand { display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; cursor:pointer; }
.brandName { font-weight:700; letter-spacing:-.01em; white-space:nowrap; display:block; }
.brandSub { display:block; color:var(--dim); font-size:11.5px; font-weight:500; }
.nav { display:flex; gap:2px; margin-left:8px; overflow-x:auto; scrollbar-width:none; }
.navLink { padding:7px 12px; border-radius:9px; text-decoration:none; color:var(--label); font-weight:600; font-size:13.5px; white-space:nowrap; cursor:pointer; }
.navLink:hover { background:rgb(24 24 27/.05); }
.navLink.on { background:#fff; color:var(--ink); box-shadow:var(--shadow); }
.who { margin-left:auto; display:flex; align-items:center; gap:10px; }
.whoName { text-align:right; font-weight:600; font-size:13px; line-height:1.2; } .whoName span { display:block; color:var(--dim); font-weight:500; font-size:11.5px; }
.main { width:min(1160px,100%); margin:0 auto; padding:26px clamp(14px,3vw,28px) 60px; }
.narrow { width:min(760px,100%); margin:0 auto; }
.pageHead { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.h1 { font:700 clamp(24px,3vw,30px)/1.15 var(--font); letter-spacing:-.03em; }
.h2 { font:700 17px/1.3 var(--font); letter-spacing:-.015em; margin-bottom:12px !important; }
.h3 { font:700 14.5px/1.3 var(--font); }
.lead { color:var(--dim); margin-top:4px !important; max-width:70ch; }
.muted { color:var(--dim); } .small { font-size:12.5px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.02em; }
.code { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:20px; letter-spacing:.14em; }
.card { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:clamp(16px,2.4vw,22px); backdrop-filter:blur(10px); }
.cardTight { background:var(--card); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
.stack { display:flex; flex-direction:column; gap:16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.between { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.grid4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
.mb { margin-bottom:16px; }
.divider { height:1px; background:var(--line); margin:14px 0; border:0; }
.stat { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:clamp(16px,2.4vw,22px); display:flex; flex-direction:column; gap:4px; }
.statLabel { color:var(--dim); font-size:12.5px; font-weight:600; } .statValue { font:700 26px/1.1 var(--font); letter-spacing:-.03em; } .statNote { color:var(--dim); font-size:12.5px; }
.meter { height:10px; border-radius:99px; background:rgb(24 24 27/.07); overflow:hidden; margin:4px 0; }
.meter i { display:block; height:100%; border-radius:99px; background:var(--ok); }
.meter.warn i { background:#F59E0B; } .meter.full i { background:var(--red); }
.banner { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:14px; font-weight:500; }
.info { background:#EEF2FF; color:#3730A3; } .okBox { background:var(--ok-soft); color:var(--ok); } .warnBox { background:var(--warn-soft); color:var(--warn); } .badBox { background:var(--bad-soft); color:var(--bad); }
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; background:rgb(24 24 27/.06); color:var(--label); }
.badge.ok { background:var(--ok-soft); color:var(--ok); } .badge.warn { background:var(--warn-soft); color:var(--warn); } .badge.bad { background:var(--bad-soft); color:var(--bad); } .badge.red { background:var(--red-soft); color:var(--red-deep); } .badge.blue { background:#E0E7FF; color:#3730A3; }
.form { display:flex; flex-direction:column; gap:14px; }
.formRow { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.label { font-size:13px; font-weight:600; color:var(--label); } .hint { font-size:12px; color:var(--dim); font-weight:400; }
.input,.select,.textarea { width:100%; padding:10px 12px; border:0; border-radius:11px; background:#fff; color:var(--ink); font:500 14.5px var(--font); box-shadow:inset 0 0 0 1px rgb(24 24 27/.12),0 1px 2px rgb(24 24 27/.04); }
.input:focus,.select:focus,.textarea:focus { outline:none; box-shadow:inset 0 0 0 1.5px var(--red),0 0 0 4px rgb(227 18 27/.1); }
.textarea { min-height:90px; resize:vertical; }
.pinInput { width:100%; padding:10px 12px; border:0; border-radius:11px; background:#fff; box-shadow:inset 0 0 0 1px rgb(24 24 27/.12); font:700 22px/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.4em; text-align:center; }
.check { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.45; } .check input { margin-top:3px; accent-color:var(--red); width:16px; height:16px; flex:none; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border:0; border-radius:11px; cursor:pointer; text-decoration:none; white-space:nowrap; font:700 14px/1.1 var(--font); background:var(--red); color:#fff !important; box-shadow:0 1px 2px rgb(178 9 18/.3),0 6px 18px rgb(227 18 27/.22); }
.btn:hover { background:#CC0F18; }
.btnGhost { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border:0; border-radius:11px; cursor:pointer; text-decoration:none; white-space:nowrap; font:700 14px/1.1 var(--font); background:#fff; color:var(--ink) !important; box-shadow:inset 0 0 0 1px rgb(24 24 27/.1),0 1px 2px rgb(24 24 27/.05); }
.btnGhost:hover { background:#fafafa; } .btnDanger { color:var(--bad) !important; }
.btnDark { background:var(--ink) !important; box-shadow:0 6px 18px rgb(24 24 27/.2) !important; }
.btnSmall { padding:7px 11px !important; font-size:13px !important; border-radius:9px !important; }
.btnLink { border:0; background:none; padding:0; color:var(--red-deep); font:600 13.5px var(--font); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.full { width:100%; }
.seg { display:inline-grid; grid-auto-flow:column; gap:3px; padding:4px; border-radius:13px; background:rgb(24 24 27/.06); }
.seg button,.seg a { border:0; border-radius:10px; padding:8px 16px; background:none; font:700 13.5px var(--font); color:var(--label); cursor:pointer; text-decoration:none; text-align:center; }
.seg .on { background:#fff; color:var(--ink); box-shadow:var(--shadow); }
.tableWrap { overflow-x:auto; }
.table { width:100%; border-collapse:collapse; font-size:13.5px; }
.table th { text-align:left; padding:10px 14px; color:var(--dim); font-size:12px; font-weight:700; white-space:nowrap; background:rgb(24 24 27/.025); }
.table td { padding:11px 14px; border-top:1px solid var(--line); vertical-align:middle; }
.table tr.dim td { color:var(--dim-2); }
.table a { font-weight:600; text-decoration:none; cursor:pointer; } .table a:hover { text-decoration:underline; }
.num { text-align:right !important; font-variant-numeric:tabular-nums; }
.empty { padding:32px 18px; text-align:center; color:var(--dim); }
.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.list li { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); }
.list li:first-child { border-top:0; }
.checklist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.checklist li { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:13px; background:#fff; box-shadow:var(--shadow); }
.tick { display:grid; place-items:center; width:24px; height:24px; border-radius:50%; flex:none; background:rgb(24 24 27/.07); color:var(--dim); font-size:13px; font-weight:800; }
.tick.done { background:var(--ok); color:#fff; }
details.more > summary { cursor:pointer; font-weight:600; color:var(--label); list-style:none; } details.more > summary::-webkit-details-marker { display:none; }
.centered { min-height:calc(100vh - 60px); display:grid; place-items:center; padding:28px 16px 60px; }
.authCard { background:var(--card); border-radius:18px; width:min(440px,100%); padding:clamp(22px,4vw,34px); box-shadow:var(--shadow-lg); }
.authCard.wide { width:min(640px,100%); }
.authHead { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; margin-bottom:22px; }
.poweredBy { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; font-weight:600; }
.poweredBy .mark { width:16px; height:16px; padding:3.4px; gap:1.8px; border-radius:4.5px; }
.authFoot { margin-top:18px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-size:12.5px; color:var(--dim); } .authFoot a { color:var(--dim); }
.steps { display:flex; gap:6px; justify-content:center; margin-bottom:18px; } .steps i { width:26px; height:5px; border-radius:99px; background:rgb(24 24 27/.1); } .steps i.on { background:var(--red); }
.slips { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
.slip { background:#fff; border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
.slip dl { margin:8px 0 0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:13px; } .slip dt { color:var(--dim); } .slip dd { margin:0; font-weight:700; word-break:break-all; }
.slipPin { font:800 18px ui-monospace,Menlo,Consolas,monospace !important; letter-spacing:.2em; }
.overlay { position:fixed; inset:0; z-index:100; overflow:auto; background:rgb(255 251 245/.97); backdrop-filter:blur(6px); padding:24px clamp(14px,3vw,28px) 80px; }
.overlayInner { width:min(1000px,100%); margin:0 auto; }
.projects { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.project { background:var(--card); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; text-decoration:none; cursor:pointer; }
.thumb { aspect-ratio:16/10; background:linear-gradient(135deg,#f4f4f5,#e4e4e7); display:grid; place-items:center; color:var(--dim-2); font-weight:700; font-size:12px; overflow:hidden; }
.thumb img { width:100%; height:100%; object-fit:contain; display:block; padding:8px; }
.projectBody { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.sticky { position:sticky; top:64px; z-index:5; }

/* ---- the simulator screen (approximation of the real simulator UI inside the portal) ---- */
.sim { position:fixed; inset:0; bottom:52px; display:grid; grid-template-rows:54px 1fr; background:#F3EEE6; font-family:Poppins,sans-serif; z-index:30; }
.simBar { display:flex; align-items:center; gap:10px; padding:0 14px; background:#fff; box-shadow:0 1px 0 rgb(0 0 0/.08); }
.simBar .home { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:#f4f4f5; cursor:pointer; font-size:17px; }
.simBar .doc { font-weight:600; font-size:15px; padding:4px 8px; border-radius:8px; }
.simBar .doc:hover { background:#f4f4f5; }
.simBar .state { font-size:12px; font-weight:600; padding:4px 10px; border-radius:99px; background:#DCFCE7; color:#15803D; }
.simBar .state.view { background:#E0E7FF; color:#3730A3; }
.simBar .r { margin-left:auto; display:flex; gap:8px; align-items:center; }
.simBar .sbtn { border:0; border-radius:10px; padding:8px 14px; font:600 13px Poppins,sans-serif; cursor:pointer; background:#f4f4f5; }
.simBar .sbtn.red { background:#E4121B; color:#fff; }
.acct { width:34px; height:34px; border-radius:50%; background:#18181B; color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; cursor:pointer; position:relative; }
.acctMenu { position:absolute; right:0; top:42px; width:230px; background:#fff; border-radius:14px; box-shadow:0 12px 40px rgb(0 0 0/.18); padding:8px; text-align:left; z-index:5; color:#18181B; font-weight:500; }
.acctMenu b { display:block; padding:6px 10px 0; } .acctMenu span { display:block; padding:0 10px 8px; color:#71717A; font-size:12px; border-bottom:1px solid #eee; margin-bottom:6px; }
.acctMenu a { display:block; padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; } .acctMenu a:hover { background:#f4f4f5; } .acctMenu a.out { color:#B91C1C; }
.simBody { display:grid; grid-template-columns:220px 1fr 260px; min-height:0; }
.parts { background:#fff; overflow:auto; padding:12px; box-shadow:1px 0 0 rgb(0 0 0/.06); }
.parts h4 { margin:12px 4px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#71717A; }
.part { display:flex; align-items:center; gap:10px; padding:6px; border-radius:10px; font-size:12.5px; font-weight:500; cursor:grab; }
.part:hover { background:#f4f4f5; } .part img { width:38px; height:38px; object-fit:contain; background:#fafafa; border-radius:8px; }
.part .soon { margin-left:auto; font-size:10px; color:#A1A1AA; }
.stage { position:relative; display:grid; place-items:center; overflow:hidden; background: radial-gradient(circle at 50% 40%, #fff 0%, #F3EEE6 70%); }
.stage img { max-width:78%; max-height:78%; filter:drop-shadow(0 30px 40px rgb(0 0 0/.18)); }
.stage .hintPill { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgb(24 24 27/.85); color:#fff; font-size:12px; padding:6px 12px; border-radius:99px; }
.insp { background:#fff; padding:16px; box-shadow:-1px 0 0 rgb(0 0 0/.06); overflow:auto; font-size:13px; }
.insp h5 { margin:0 0 4px; font-size:15px; } .insp .k { color:#71717A; font-size:12px; margin-top:12px; }
.insp input[type=range] { width:100%; accent-color:#E4121B; }
.insp pre { background:#18181B; color:#E4E4E7; border-radius:10px; padding:10px; font-size:11.5px; overflow:auto; }

/* ---- prototype switcher (not part of the real UI) ---- */
#proto { position:fixed; left:0; right:0; bottom:0; z-index:1000; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; background:rgba(24,24,27,.95); color:#fff; font:600 12.5px var(--font); box-shadow:0 -6px 24px rgb(0 0 0/.2); }
#proto .tag { padding:4px 9px; border-radius:99px; background:#E3121B; font-size:10.5px; letter-spacing:.06em; }
#proto button, #proto select { all:unset; cursor:pointer; padding:6px 11px; border-radius:9px; background:rgba(255,255,255,.1); white-space:nowrap; }
#proto button.on { background:#fff; color:#18181B; }
#proto select { appearance:auto; background:#3f3f46; }
#proto .sp { margin-left:auto; opacity:.65; font-weight:500; }
@media (max-width:900px) { .simBody { grid-template-columns:160px 1fr; } .insp { display:none; } }
@media (max-width:760px) { .top { flex-wrap:wrap; gap:8px; } .nav { order:3; width:100%; margin-left:0; } .whoName { display:none; } }
</style>
</head>
<body>
<div class="root" id="app"></div>
<div id="overlay"></div>

<div id="proto" aria-label="Preview switcher (not part of the real UI)">
  <span class="tag">UI PREVIEW · DEMO DATA</span>
  <button data-go="console/enquiries" data-role="console">StemGrid console</button>
  <button data-go="admin/dashboard" data-role="admin">Institute admin</button>
  <button data-go="teacher/batches" data-role="teacher">Teacher</button>
  <button data-go="student/home" data-role="student">Student</button>
  <button data-go="public/login" data-role="public">Sign-in &amp; join</button>
  <button data-go="activate/1" data-role="activate">New institute activation</button>
  <select id="stateSel" title="Show the admin pages in another institute state">
    <option value="free">State: free period</option>
    <option value="near">State: near the limit (88/90)</option>
    <option value="grace">State: payment due (grace)</option>
    <option value="suspended">State: suspended (read-only)</option>
  </select>
  <span class="sp">Every page is clickable · nothing is saved</span>
</div>

    <p style="font-size:18px">You are member <b>#5</b> · Founding Partners</p><p class="muted">Invoice SG/2026-27/0007 is on your billing page.</p><p class="muted">Our team will contact you to schedule onboarding and training. Your free period starts when onboarding is complete (or 7 days after payment, whichever comes first).</p>
    <p><a class="btn" onclick="go('admin/setup')">Set up your portal</a></p></div></div></div>`;
  return `<div class="centered"><div class="authCard wide">${top}<div class="stack">${steps}${bodies[step]}</div><div class="authFoot"><a>Membership terms</a><a>Privacy</a><a>info@stemgrid.in</a><span>+91 89251 72636</span></div></div></div>`;
};

      ${pre ? '' : `<tr><td>4 Oct 2026</td><td>joining</td><td class="num">₹6,490</td><td>razorpay</td><td>${badge('paid', 'ok')}</td></tr>`}</tbody></table>${pre ? '<div class="empty">No payments yet.</div>' : ''}</div></div>
  <div class="stack"><div class="card"><h2 class="h2">Actions</h2><div class="stack">
    ${pre ? act('Resend activation link') + act('Record bank transfer', `<div class="formRow">${field('For', '<select class="select"><option>Joining</option></select>')}${field('Amount before GST (₹)', '<input class="input" value="6000">')}</div>${field('Reference / note', '<input class="input" placeholder="UTR or bank reference">')}`) + act('Reject (before payment)', field('Reason', '<input class="input">'), 1)

      + (i.status === 'grace' ? act('Reactivate') : '') + act('Start grace (payment failed)') + act('Suspend', '', 1)}
    <details class="more"><summary>Change portal address</summary></details></div></div>
  <div class="card"><h2 class="h2">Activity</h2><ul class="list">${(pre ? [['institute.approved', 'Demo Staff → approved', '24 Nov 2026, 3:10 pm'], ['institute.activation_sent', 'Demo Staff', '24 Nov 2026, 3:10 pm']] : [['batch.created', 'Anita Rao (institute_admin)', '22 Nov 2026, 11:03 am'], ['institute.onboarding_complete', 'Demo Staff → free_period', '9 Oct 2026, 4:00 pm'], ['institute.paid', 'Razorpay webhook → paid', '4 Oct 2026, 11:42 am'], ['institute.approved', 'Demo Staff → approved', '28 Jul 2026, 10:00 am']])
    .map(([a, w, t]) => `<li style="align-items:flex-start"><span><b>${a}</b><br><span class="small muted">${w}</span></span><span class="small muted">${t}</span></li>`).join('')}</ul></div></div></div>`); };

/* ============================================================ router */
function render() {
  const raw = location.hash.slice(2) || 'admin/dashboard';
  const [path, q] = raw.split('?');
  const parts = path.split('/');
  let view = V[path], args = [q];
  if (!view) { view = V[parts.slice(0, 2).join('/')] ?? V[parts[0]]; args = [parts[parts[0] === 'activate' ? 1 : 2], q]; }
  if (!view) { view = V['admin/dashboard']; args = []; }
  $('#overlay').innerHTML = '';
  $('#app').innerHTML = view(...args);
  const role = parts[0] === 'public' ? 'public' : parts[0] === 'student' && parts[1] === 'simulator' ? 'student' : parts[0];
  document.querySelectorAll('#proto [data-role]').forEach(b => b.classList.toggle('on', b.dataset.role === role));
  window.scrollTo(0, 0);
}
document.querySelectorAll('#proto [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('#stateSel').addEventListener('change', e => { STATE = e.target.value; if (!location.hash.startsWith('#/admin') && !location.hash.startsWith('#/teacher')) go('admin/dashboard'); else render(); });
window.addEventListener('hashchange', render);
render();
</script>
